# ミチト：TestFlight の配り先を古いビルドを期限切れにする（あなたの OK のものだけ）。起動：タグ asc-tf-expire-* の push
name: Michito TestFlight expire
on:
  push:
    tags:
      - "asc-tf-expire-*"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 期限切れ
        run: node .github/scripts/asc-tf-expire.mjs
