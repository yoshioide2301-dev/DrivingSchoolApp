<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ミチト</title>
  <meta name="description" content="運転免許学科試験対策アプリ ミチト｜今日も、少しずつ。">
  <link rel="manifest" href="manifest.json">
  <script>
    // 保存済みテーマを style.css より先に適用し、起動時に初期テーマが一瞬見えるのを防ぐ。
    // 許可値は app.js の THEME_OPTIONS と揃えること。未保存・破損・不正な値は初期テーマ（sora）。
    (function () {
      var theme = "sora";
      try {
        var raw = JSON.parse(localStorage.getItem("michito_settings"));
        if (raw && typeof raw === "object" && !Array.isArray(raw) &&
            (raw.theme === "sora" || raw.theme === "yawaraka" || raw.theme === "yoru")) {
          theme = raw.theme;
        }
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <!-- TODO: 本番用アイコンを icons/ に配置後、favicon等を設定 -->
  <!-- ブランド名「ミチト」のアイコン画像は現時点でプロジェクトに未配置のため、
       アイコン実装は保留（仮画像等をproductionへ追加していません） -->
</head>
<body>
  <div id="app"></div>

  <script>
    // 両手の親指で素早く操作したときに、ピンチや2回タップで画面が拡大して戻らなくなるのを防ぐ（10/17 息子さんの端末で何度か発生）。文字の大きさは設定で変えられる
    ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
  </script>
  <script src="questions/questions.js"></script>
  <script src="questions/furigana.js"></script>
  <script src="signs/signs.js"></script>
  <script src="signs/tips.js"></script>
  <script src="questions/figures.js"></script>
  <script src="support.js"></script>
  <script src="app.js"></script>
</body>
</html>
